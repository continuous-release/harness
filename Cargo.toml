[package]
name = "cr-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Release-contract harness for continuous-release"
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
