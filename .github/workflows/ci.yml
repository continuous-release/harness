name: ci

on:
  push:
    branches: [main]
  pull_request:

# The sandbox pool is shared, so only one suite runs at a time. Within a run,
# the live scenarios are sharded across the pool.
concurrency:
  group: release-harness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local:
    name: local scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install the release toolkit
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cr" \
            https://github.com/continuous-release/toolkit/releases/download/v0.3.1/cr-linux-x86_64
          chmod +x "$RUNNER_TEMP/cr"
          echo "CR_BIN=$RUNNER_TEMP/cr" >> "$GITHUB_ENV"

      - name: Run local scenarios
        run: cargo run --release --locked -- run --all

  live:
    name: live shard ${{ matrix.shard }}
    # Fork pull requests do not receive secrets; the local suite still gates
    # them. A maintainer can push the branch to this repository to get a live
    # run without exposing the token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the harness
        run: cargo build --release --locked

      - name: Run live scenarios
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_HARNESS_TOKEN }}
        run: |
          cargo run --release --locked -- run --all --live \
            --repo continuous-release/sandbox-${{ matrix.shard }} \
            --shard ${{ matrix.shard }}/4
